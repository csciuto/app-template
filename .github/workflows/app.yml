# Shared test-and-deploy workflow for the apps at corey.sciu.to. Each app calls it from its own
# .github/workflows/deploy.yml:
#
#   jobs:
#     app:
#       uses: csciuto/app-template/.github/workflows/app.yml@v1
#       with:
#         stamp: index.html help.html
#
# Test: unit tests (npm test, if the app has one), optional Python tests, then the Playwright browser
# tests (desktop and phone, with accessibility checks). Deploy (main only, after tests pass): stamps
# v1.<number of commits> into each page's <span class="version" title="Version">dev</span>, adds
# ?v=<version> to every reference from one file of the site to another (.github/scripts/stamp.py), writes
# version.json, and publishes to GitHub Pages.
on:
  workflow_call:
    inputs:
      site:
        description: Folder to publish. "." publishes the repo minus tests and tooling.
        type: string
        default: "."
      stamp:
        description: Pages (relative to the site folder) whose version span gets the version. Empty for none.
        type: string
        default: index.html
      python-test:
        description: Command for Python tests, run after pip install -r requirements-test.txt. Empty to skip.
        type: string
        default: ""
      browser-test:
        description: Command for the browser tests. Empty to skip.
        type: string
        default: npx playwright test
      after-build:
        description: Shell run in the site folder just before publishing (e.g. a redirect page).
        type: string
        default: ""

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15      # a stuck package download fails here instead of hanging for hours
    steps:
      - uses: actions/checkout@v4
      - if: hashFiles('package.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - if: hashFiles('package.json') != ''
        run: npm ci && npm test --if-present
      - if: inputs.python-test != ''
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - if: inputs.python-test != ''
        run: pip install -r requirements-test.txt && ${{ inputs.python-test }}
      - if: inputs.browser-test != ''
        run: |
          if [ -f package.json ]; then npx playwright install --with-deps chromium
          else python -m playwright install --with-deps chromium; fi
          ${{ inputs.browser-test }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4      # this workflow's own scripts, at the version the app calls
        with:
          repository: csciuto/app-template
          ref: v1
          path: .app-template
          sparse-checkout: .github/scripts
      - name: Build the site
        env:
          SITE: ${{ inputs.site }}
          STAMP: ${{ inputs.stamp }}
        run: |
          VERSION="v1.$(git rev-list --count HEAD)"
          COMMIT="$(git rev-parse --short HEAD)"
          DATE="$(git log -1 --format=%cs)"
          STAMPER="$PWD/.app-template/.github/scripts/stamp.py"
          if [ "$SITE" = "." ]; then
            cp "$STAMPER" "$RUNNER_TEMP/stamp.py"; STAMPER="$RUNNER_TEMP/stamp.py"
            rm -rf .app-template node_modules tests e2e .github package*.json playwright.config.js vitest.config.js requirements-test.txt
          fi
          cd "$SITE"
          python3 "$STAMPER" "$VERSION" "$COMMIT" "$DATE" $STAMP
          echo "Deploying $VERSION"
      - if: inputs.after-build != ''
        working-directory: ${{ inputs.site }}
        run: ${{ inputs.after-build }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ inputs.site }}
      - id: deployment
        uses: actions/deploy-pages@v4
